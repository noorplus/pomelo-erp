name: Supabase Database Tests

on:
  push:
    branches: [main, "chore/**", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  database:
    name: Migration and database tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Reset database from migrations and seed
        run: supabase db reset
      - name: Verify migration history
        run: supabase migration list --local
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Lint database
        run: supabase db lint --level error
      - name: Stop local Supabase
        if: always()
        run: supabase stop
