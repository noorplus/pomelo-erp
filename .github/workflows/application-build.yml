name: Application build

on:
  pull_request:
    paths-ignore:
      - "supabase/migrations/**"
      - "supabase/tests/**"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
